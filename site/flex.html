<!DOCTYPE html>
<html lang="ru">
<head>

<body>
  <nav aria-label="Навигация"><a href="index.html?v=2">Главная</a> · <a href="grid.html?v=2">Grid</a> · <a href="flex.html?v=2" aria-current="page">Flexbox</a> · <a href="dock.html?v=2">Dock</a></nav>
  <h1>Пример Flexbox</h1>
  <p>Блоки расположены в строку. Если места не хватает, они переносятся на следующую строку.</p>
  <div class="flex">
    <div class="box">Первый</div>
    <div class="box">Второй</div>
    <div class="box">Третий</div>
  </div>
  <pre><code>.flex {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.flex .box {
  flex: 1 1 160px;
}</code></pre>
</body>
