<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лабораторная №5 — Словарь</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="lab5.ts"></script>
</head>
<body class="algorithms-page">
  <nav aria-label="Навигация"><a href="index.html?v=2">Главная</a> · <a href="grid.html?v=2">Grid</a> · <a href="flex.html?v=2">Flexbox</a> · <a href="dock.html?v=2">Dock</a> · <a href="algorithms.html?v=2">JavaScript</a> · <a href="heap.html?v=2">Heap</a> · <a href="dictionary.html?v=2" aria-current="page">Словарь</a> · <a href="suffix.html?v=2">Суффиксное дерево</a></nav>
  <h1>Лабораторная №5</h1>

  <section aria-labelledby="list-heading">
    <h2 id="list-heading">Добавить список слов</h2>
    <form id="list-form">
      <textarea id="words" rows="3" aria-label="Слова, по одному на строку" placeholder="По одному слову на строку">кот
котик
коты</textarea>
      <button type="submit">Добавить список</button>
    </form>
    <p class="result" id="list-result" role="status">Результат появится здесь.</p>
  </section>

  <section aria-labelledby="add-heading">
    <h2 id="add-heading">Добавить слово</h2>
    <form id="add-form">
      <input id="word" value="котёнок" aria-label="Новое слово" placeholder="Слово">
      <button type="submit">Добавить</button>
    </form>
    <p class="result" id="add-result" role="status">Результат появится здесь.</p>
  </section>

  <section aria-labelledby="search-heading">
    <h2 id="search-heading">Проверить слово</h2>
    <form id="search-form">
      <input id="query" value="кот" aria-label="Искомое слово" placeholder="Слово">
      <button type="submit">Проверить</button>
    </form>
    <p class="result" id="search-result" role="status">Результат появится здесь.</p>
  </section>
</body>
</html>
