  <h1>Пример Grid</h1>
  <p>Шесть блоков расположены в три столбца. Между блоками — отступ 12 пикселей.</p>
  <div class="grid">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
  </div>
  <pre><code>.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}</code></pre>
</body>
